<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; line-height: 1.6; margin: 0; }
        
        /* تلوين اسم الموقع */

        .info-box { background: #333; padding: 20px; border-radius: 8px; color: white; margin-top: 30px; text-align: center; }
        
        /* Dark Mode تلقائي */
        @media (prefers-color-scheme: dark) {
            body { background-color: #121212; color: #eee; }
            .category { background-color: #1e1e1e; }

</head>
